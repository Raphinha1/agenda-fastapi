<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mi Agenda{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', path='/favicon.svg') }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
</head>
<body>
  <header class="site-header"><div class="container header-inner">
    <a class="brand" href="/views/agenda">Agenda Institucional</a>
    {% if user %}<form action="/views/logout" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="link-button" type="submit">Salir</button></form>{% endif %}
  </div></header>
  <main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
